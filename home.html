<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Akshata Sawant | Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #6c3cff, #a855f7);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            width: 900px;
            max-width: 100%;
            min-height: 520px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        /* Left Side */
        .left-side {
            width: 50%;
            background: linear-gradient(135deg, #5b2dd8, #8b5cf6);
            color: white;
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .left-side h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .left-side h1 span {
            color: #ffd6ff;
        }

        .left-side h2 {
            font-size: 22px;
            margin-bottom: 20px;
        }

        .left-side p {
            line-height: 1.7;
            font-size: 15px;
            opacity: 0.9;
        }

        .developer-box {
            margin-top: 30px;
            font-size: 70px;
            font-weight: bold;
            text-align: center;
            border: 2px solid white;
            border-radius: 50%;
            width: 150px;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Right Side */
        .right-side {
            width: 50%;
            padding: 50px 45px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .right-side h2 {
            font-size: 32px;
            color: #333;
            margin-bottom: 10px;
        }

        .right-side p {
            color: #777;
            margin-bottom: 30px;
        }

        .input-box {
            margin-bottom: 20px;
        }

        .input-box label {
            display: block;
            margin-bottom: 7px;
            color: #555;
            font-size: 14px;
        }

        .input-box input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
        }

        .input-box input:focus {
            border-color: #6c3cff;
        }

        .remember {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .remember a {
            text-decoration: none;
            color: #6c3cff;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #6c3cff;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #5124cc;
        }

        .signup {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .signup a {
            color: #6c3cff;
            text-decoration: none;
            font-weight: bold;
        }

        /* Responsive Design */
        @media (max-width: 700px) {

            .login-container {
                flex-direction: column;
            }

            .left-side,
            .right-side {
                width: 100%;
            }

            .left-side {
                padding: 40px 30px;
                text-align: center;
                align-items: center;
            }

            .left-side h1 {
                font-size: 32px;
            }

            .developer-box {
                width: 110px;
                height: 110px;
                font-size: 50px;
            }

            .right-side {
                padding: 40px 30px;
            }
        }

    </style>
</head>

<body>

    <div class="login-container">

        <!-- Left Portfolio Section -->
        <div class="left-side">

            <h1>Akshata <span>Sawant</span></h1>

            <h2>Frontend Developer</h2>

            <p>
                Welcome to my portfolio website. Login to explore my
                skills, projects and web development journey.
            </p>

            <div class="developer-box">
            
            </div>

        </div>


        <!-- Right Login Section -->
        <div class="right-side">

            <h2>Welcome Back!</h2>

            <p>Please login to your account</p>

            <form>

                <div class="input-box">
                    <label>Email Address</label>

                    <input
                        type="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>


                <div class="input-box">
                    <label>Password</label>

                    <input
                        type="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>


                <div class="remember">

                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">Forgot Password?</a>

                </div>


                <button type="submit" class="login-btn">
                    Login
                </button>

            </form>


            <div class="signup">
                Don't have an account?
                <a href="#">Sign Up</a>
            </div>

        </div>

    </div>

</body>
</html>
